# render.yaml
services:
  - type: web
    name: msconnect-backend
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/maintenance-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: msconnect-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: msconnect-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: msconnect-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080

  - type: postgresql
    name: msconnect-db
    plan: free